<!DOCTYPE html>
<html>
<head>
    <title>WebBrief AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>WebBrief AI</h1>

        <p>Turn any webpage into a concise AI-powered summary.</p>

        <form action="/summarize" method="POST">
            <input
                type="text"
                name="url"
                placeholder="Paste webpage URL here"
                required
            >

            <button type="submit">Summarize</button>
        </form>

    </div>

</body>
</html>
